name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: mkdir www && cp index.html manifest.json sw.js icon-*.png www/
      - run: npx cap add android && npx cap sync android
      - run: |
          sudo apt-get install -y imagemagick
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${p%%:*}; s=${p##*:}
            convert icon-512.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher.png
            convert icon-512.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher_round.png
          done
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: gh release create v${{ github.run_number }} android/app/build/outputs/apk/debug/app-debug.apk --title "SELFITNESS v${{ github.run_number }}" --notes "Install app-debug.apk"
        env:
          GH_TOKEN: ${{ github.token }}
