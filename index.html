<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<title>YOUR FITNESS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ===== Modern glass theme: dark/light mode + 3 accent colours ===== */
:root{--bg:#070b16;--card:rgba(255,255,255,.045);--tx:#eef3ff;--mut:#8b97b5;--ac:#10b981;--ac2:#22d3ee;--ln:rgba(255,255,255,.09);--bad:#fb7185;--in:rgba(255,255,255,.06);--glow:rgba(16,185,129,.18)}
[data-theme=light]{--bg:#eef3f9;--card:rgba(255,255,255,.85);--tx:#0b1324;--mut:#586783;--ac:#059669;--ac2:#0891b2;--ln:rgba(15,30,60,.1);--bad:#e11d48;--in:#f3f6fb;--glow:rgba(5,150,105,.14)}
[data-acc=ocean]{--ac:#22d3ee;--ac2:#818cf8;--glow:rgba(34,211,238,.18)}
[data-acc=sunset]{--ac:#fb923c;--ac2:#f472b6;--glow:rgba(251,146,60,.18)}
*{box-sizing:border-box;margin:0}
body{padding-top:env(safe-area-inset-top,0px);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:150px;min-height:100vh;background-image:radial-gradient(520px 320px at 90% -5%,var(--glow),transparent),radial-gradient(480px 300px at -10% 40%,rgba(99,102,241,.12),transparent);background-attachment:fixed;transition:background-color .3s}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;position:sticky;top:0;z-index:5;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 70%,transparent)}
.logo{font-weight:900;font-size:1.15rem;letter-spacing:1.5px}.logo b{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hr{display:flex;gap:8px;align-items:center}
.pill{font-size:.72rem;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--ln);color:var(--mut)}.pill.on{color:var(--ac)}
main{max-width:760px;margin:0 auto;padding:10px 14px}
h2{font-size:1.6rem;font-weight:800;letter-spacing:-.5px;margin:6px 0 14px}h3{font-size:1rem;font-weight:700;margin-bottom:8px}
.card,.stat{background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:16px;margin-bottom:12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.12)}
.card{animation:in .4s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid .stat{margin:0}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.stat small{color:var(--mut);display:block;font-size:.8rem}.stat b{font-size:1.55rem;font-weight:800;letter-spacing:-.5px}.stat span{font-size:.78rem;color:var(--mut);margin-left:3px}
.hero{background:linear-gradient(135deg,var(--glow),transparent 70%),var(--card)}.hero h2{margin:0}.hero p{color:var(--mut)}
.bar{height:7px;background:var(--ln);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:9px;transition:width .7s}
label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:9px}
input,select{width:100%;margin-top:4px;padding:11px 12px;border-radius:14px;border:1px solid var(--ln);background:var(--in);color:var(--tx);font:inherit}
select option{color:#111}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04130d;font-weight:700;transition:transform .15s}
button:active{transform:scale(.96)}
button.s{background:var(--in);color:var(--tx);border:1px solid var(--ln)}button.d{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button.sm{padding:5px 10px;font-size:.8rem;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px 0;border-top:1px solid var(--ln)}.item:first-of-type{border-top:0}.item small{color:var(--mut);display:block}
.note{font-size:.78rem;color:var(--mut);margin:6px 0}
.tip{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--ln)}.tip:first-of-type{border-top:0}
.tip i{font-style:normal;font-size:1.3rem;width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:14px;background:var(--glow)}
.tip b{display:block;font-size:.92rem}.tip span{font-size:.84rem;color:var(--mut)}
.sw{width:44px;height:44px;border-radius:50%;padding:0;border:3px solid var(--ln)}.sw.on{border-color:var(--tx)}
nav{position:fixed;left:10px;right:10px;bottom:calc(var(--lift,54px) + env(safe-area-inset-bottom));display:flex;overflow-x:auto;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--ln);border-radius:26px;padding:6px;z-index:9;justify-content:safe center;box-shadow:0 10px 40px rgba(0,0,0,.35);max-width:760px;margin:0 auto}
nav button{flex:0 0 auto;min-width:60px;background:none;color:var(--mut);font-size:.66rem;padding:6px 8px;font-weight:600;border-radius:18px}
nav button span{display:block;font-size:1.2rem}nav button.on{color:var(--ac);background:var(--glow)}
.ch{width:100%;height:auto}.ch text{fill:var(--mut);font-size:9px}
.ring{display:flex;align-items:center;gap:16px}.ring svg{flex:0 0 100px}
#toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04130d;padding:10px 18px;border-radius:16px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:20;max-width:90%}
#toast.show{opacity:1}#toast.err{background:var(--bad);color:#fff}
.empty{color:var(--mut);text-align:center;padding:14px}
/* v3 modern touches */
.card{border-top:1px solid rgba(255,255,255,.16)}
h2,.stat b{background:linear-gradient(90deg,var(--tx),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{padding:20px;border-radius:28px;background:linear-gradient(135deg,var(--glow),transparent 60%),var(--card)}.hero h2{font-size:1.9rem}
nav{border-radius:30px}nav button.on{box-shadow:0 0 0 1px var(--ac) inset}
.glass{height:120px;width:72px;border:3px solid var(--ln);border-radius:8px 8px 24px 24px;margin:6px auto 12px;position:relative;overflow:hidden}.glass i{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(#38bdf8,#0ea5e9);transition:height .8s}
</style>
</head>
<body>
<header><div class="logo">YOUR <b>FITNESS</b></div><div class="hr"><span id="net" class="pill"></span><button class="s sm" onclick="toggleTheme()" aria-label="Toggle light or dark mode">◐ Theme</button></div></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="toast" role="status"></div>
<script>
/* ============ DATA LAYER: everything is saved in this browser's localStorage ============ */
const CLD=window.claude||{use:async()=>null};
const KEY='yourfitness_v1';
const DEF={p:{name:'',gender:'',age:'',h:'',goal:'Stay fit',cal:2000,water:2500,ex:30,theme:'dark'},food:[],cust:[],ex:[],wt:[],wa:[],sl:[]};
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));return r?Object.assign(structuredClone(DEF),r,{p:Object.assign({},DEF.p,r.p)}):structuredClone(DEF)}catch(e){return structuredClone(DEF)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloud();return true}
/* Online: your data is stored in your private cloud space (db capability); localStorage is only a quick cache */
let DB=null,UID=null,tm=null;
function setSync(t){const e=g('net');if(e){e.textContent=t;e.className='pill'+(t[0]==='●'?' on':'')}}
function cloud(){if(!DB)return;clearTimeout(tm);tm=setTimeout(async()=>{try{setSync('↻ Saving…');await DB.doc('data/users/'+UID+'/yf').set({json:JSON.stringify(S)});setSync('● Saved online')}catch(e){setSync('! Save failed')}},700)}
async function initCloud(){try{const db=await CLD.use('db'),u=await CLD.use('user');if(!db||!u){setSync('○ Saved on this device');return}
 DB=db;UID=await u.id();const sn=await DB.doc('data/users/'+UID+'/yf').get();
 if(sn.exists){S=Object.assign(structuredClone(DEF),JSON.parse(sn.data().json));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}applyTheme();render();setSync('● Saved online')}else{cloud()}}catch(e){setSync('! Online error')}}

/* ============ HELPERS ============ */
const g=id=>document.getElementById(id),V=id=>g(id).value.trim(),N=id=>parseFloat(g(id).value);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ymd=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const days=n=>Array.from({length:n},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(n-1-i));return ymd(d)});
const sum=(c,d,f)=>S[c].filter(x=>x.d===d).reduce((a,x)=>a+(+x[f]||0),0);
const rd=(x,n=0)=>Math.round(x*10**n)/10**n;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(a,b)=>b>0?Math.min(100,Math.round(a/b*100)):0;
const hm=m=>Math.floor(m/60)+'h '+Math.round(m%60)+'m';
function toast(t,err){const e=g('toast');e.textContent=t;e.className='show'+(err?' err':'');setTimeout(()=>e.className='',2200)}
function bad(msg){toast(msg,1);return false}
const lastW=()=>[...S.wt].sort((a,b)=>(a.d+(a.t||'')).localeCompare(b.d+(b.t||''))).pop();
function bmiOf(){const w=lastW();if(!w)return null;const h=(+w.h||+S.p.h)/100;if(!h||!w.w)return null;const b=w.w/(h*h);return{v:rd(b,1),c:b<18.5?'Underweight':b<25?'Normal':b<30?'Overweight':'Obese'}}
function bars(v,l,col,goal){const m=Math.max(...v,goal||0,1),w=300/v.length;let s='<svg viewBox="0 0 300 130" class="ch" role="img" aria-label="Bar chart">';
 v.forEach((x,i)=>{const h=x/m*90;s+=`<rect x="${i*w+w*.15}" y="${105-h}" width="${w*.7}" height="${h}" rx="3" fill="${col}"/>`;
  if(v.length<=8||i%5===0)s+=`<text x="${i*w+w/2}" y="122" text-anchor="middle">${l[i]}</text>`;
  if(v.length<=8&&x)s+=`<text x="${i*w+w/2}" y="${100-h}" text-anchor="middle">${rd(x,1)}</text>`});
 if(goal)s+=`<line x1="0" x2="300" y1="${105-goal/m*90}" y2="${105-goal/m*90}" stroke="${col}" stroke-dasharray="4" opacity=".6"/>`;
 return s+'</svg>'}
function line(pts){if(pts.length<2)return'<p class="empty">Add at least 2 weight records to see the chart.</p>';
 const ys=pts.map(p=>p.w),mn=Math.min(...ys),mx=Math.max(...ys),rg=(mx-mn)||1;
 const xy=pts.map((p,i)=>[10+i*(280/(pts.length-1)),100-(p.w-mn)/rg*80]);
 return`<svg viewBox="0 0 300 130" class="ch" role="img" aria-label="Weight chart"><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${xy.map(p=>p.join(',')).join(' ')}"/>${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--ac)"/>`).join('')}<text x="2" y="12">${mx} kg</text><text x="2" y="118">${mn} kg</text></svg>`}
function bar1(p){return`<div class="bar"><i style="width:${p}%"></i></div>`}
function dateNav(){return`<label>Viewing date<input type="date" id="vdate" value="${vd}" onchange="vd=this.value||ymd();render()"></label>`}
const wd=d=>['Su','Mo','Tu','We','Th','Fr','Sa'][new Date(d+'T00:00').getDay()];

/* ============ STATE & ROUTER ============ */
let page='home',edit=null,vd=ymd(),rep='week';
const PAGES=[['home','🏠','Home'],['ai','🤖','Coach'],['food','🍛','Food'],['ex','🏃','Move'],['water','💧','Water'],['body','⚖️','Body'],['sleep','😴','Sleep'],['rep','📊','Reports'],['set','⚙️','Settings']];
function go(p){if(tI){clearInterval(tI);tI=null}page=p;edit=null;vd=ymd();render();scrollTo(0,0)}
function render(){
 g('nav').innerHTML=PAGES.map(p=>`<button class="${p[0]===page?'on':''}" onclick="go('${p[0]}')" aria-label="${p[2]}"><span>${p[1]}</span>${p[2]}</button>`).join('');
 g('main').innerHTML=({home:pgHome,ai:pgAI,food:pgFood,ex:pgEx,water:pgWater,body:pgBody,sleep:pgSleep,rep:pgRep,set:pgSet})[page]();
 if(page==='food')fPick(1)}
function ed(c,id){edit=id;render();scrollTo(0,0)}
function del(c,id){if(!confirm('Delete this entry?'))return;S[c]=S[c].filter(x=>x.id!==id);save();toast('Deleted');render()}
const cur=c=>S[c].find(x=>x.id===edit)||{};
function btns(c,id){return`<span class="row"><button class="s sm" onclick="ed('${c}','${id}')">Edit</button><button class="d sm" onclick="del('${c}','${id}')">Delete</button></span>`}
function upsert(c,o){const i=S[c].findIndex(x=>x.id===edit);if(i>=0){o.id=edit;S[c][i]=o}else{o.id=uid();S[c].push(o)}
 if(!save())return;toast(i>=0?'Updated ✓':'Saved ✓');edit=null;render()}

/* ============ HOME ============ */
const MSG=['Small steps every day add up.','Drink water, move your body, sleep well.','Progress, not perfection.','You showed up today. That counts.','Consistency beats intensity.','Your future self will thank you.','Strong habits build a strong body.'];
function pgHome(){
 const t=ymd(),k=sum('food',t,'k'),b=sum('ex',t,'cal'),w=sum('wa',t,'ml'),m=sum('ex',t,'min'),lw=lastW(),bm=bmiOf();
 const pr=Math.round((pct(k,S.p.cal)+pct(w,S.p.water)+pct(m,S.p.ex))/3),C=2*Math.PI*40;
 const wk=days(7).map(d=>sum('ex',d,'min'));
 return`<div class="card hero"><p>${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</p><h2>${greet()}${S.p.name?', '+esc(S.p.name):''} 👋</h2><p>${MSG[new Date().getDate()%MSG.length]}</p><p>🔥 <b style="color:var(--ac)">${streak()}-day</b> logging streak</p></div>
 <div class="card"><h3>Today · ${pr}% of goals</h3><div class="row" style="justify-content:space-around">${rg(pct(k,S.p.cal),'Calories',rd(k),'var(--ac)')}${rg(pct(w,S.p.water),'Water',w+' ml','#38bdf8')}${rg(pct(m,S.p.ex),'Exercise',rd(m)+' min','#fbbf24')}${rg(pct(dayData().T.p,dayData().G.p),'Protein',rd(dayData().T.p)+' g','#a78bfa')}</div></div>
${tips(k,w,m,bm)}${macros()}${fastCard()}${badges()}
 <div class="grid">
 <div class="stat"><small>Calories in</small><b>${rd(k)}</b><span>/ ${S.p.cal} kcal</span>${bar1(pct(k,S.p.cal))}</div>
 <div class="stat"><small>Calories burned</small><b>${rd(b)}</b><span>kcal</span></div>
 <div class="stat"><small>Water</small><b>${w}</b><span>/ ${S.p.water} ml</span>${bar1(pct(w,S.p.water))}</div>
 <div class="stat"><small>Exercise</small><b>${rd(m)}</b><span>/ ${S.p.ex} min</span>${bar1(pct(m,S.p.ex))}</div>
 <div class="stat"><small>Weight</small><b>${lw?lw.w+' kg':'—'}</b><span>${lw&&lw.tw?'Target '+lw.tw+' kg':'Add in Body'}</span></div>
 <div class="stat"><small>BMI</small><b>${bm?bm.v:'—'}</b><span>${bm?bm.c:'Add height & weight'}</span></div></div>
 <div class="card" style="margin-top:12px"><h3>Quick actions</h3><div class="row"><button onclick="quickWater(250)">+250 ml</button><button onclick="quickWater(500)">+500 ml</button><button class="s" onclick="go('food')">Add food</button><button class="s" onclick="go('ex')">Log exercise</button><button class="s" onclick="go('body')">Log weight</button></div></div>
 <div class="card"><h3>This week: exercise minutes</h3>${bars(wk,days(7).map(wd),'var(--ac)',S.p.ex)}</div>`}
const greet=()=>{const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'};
/* Rule-based suggestions from today's data (general wellness tips, not medical advice) */
function tips(k,w,m,bm){const t=ymd(),h=new Date().getHours(),L=[],P=S.food.filter(x=>x.d===t).reduce((a,x)=>a+x.p,0),wt=(lastW()||{}).w||65,sl=sum('sl',t,'min');
 const exp=Math.max(0.1,Math.min(1,(h-6)/15));
 if(w<S.p.water*exp*0.8)L.push(['💧','Time to hydrate','You are behind on water. Drink a glass (250 ml) now.']);
 if(h>=14&&k<S.p.cal*0.35)L.push(['🍛','Eat a balanced meal','Calories are low for this time. Try rice or roti with dal, egg or fish, and vegetables.']);
 else if(k>S.p.cal*1.1)L.push(['🥗','Keep dinner light','You passed your calorie goal. Choose vegetables and protein, and skip sweet drinks.']);
 if(k>0&&P<wt*0.8*0.5)L.push(['🥚','Add protein','Protein is low so far. Egg, dal, fish, chicken or milk can help.']);
 if(m<S.p.ex)L.push(['🚶',m?'Almost there':'Get moving',(S.p.ex-m)+' more minutes of exercise reaches your goal. A brisk walk counts.']);else L.push(['🏆','Exercise goal done','Great work. Stretch or rest well today.']);
 if(sl&&sl<360)L.push(['😴','Sleep a little more','You slept under 6 hours. Try going to bed 30 minutes earlier tonight.']);
 if(bm&&bm.c==='Overweight'||bm&&bm.c==='Obese')L.push(['🎯','Small steady steps','Aim for daily walks and fewer sugary snacks. Slow progress lasts.']);
 if(bm&&bm.c==='Underweight')L.push(['🍌','Add healthy calories','Add banana, milk, eggs or nuts between meals.']);
 if(!L.length)L.push(['✨','You are on track','Keep logging every day to see your trends.']);
 return`<div class="card"><h3>Smart suggestions</h3>${L.slice(0,4).map(x=>`<div class="tip"><i>${x[0]}</i><div><b>${x[1]}</b><span>${x[2]}</span></div></div>`).join('')}<p class="note">General wellness tips, not medical advice. See a doctor for health concerns.</p></div>`}
function streak(){const has=d=>['food','ex','wa','wt','sl'].some(c=>S[c].some(x=>x.d===d)),D=days(90).reverse();let i=has(D[0])?0:1,n=0;for(;i<D.length&&has(D[i]);i++)n++;return n}
function macros(){const D=dayData();return`<div class="card"><h3>Macros today</h3>${[['Protein',D.T.p,D.G.p],['Carbs',D.T.c,D.G.c],['Fat',D.T.f,D.G.f]].map(r=>`<div style="margin-bottom:8px"><div class="row" style="justify-content:space-between"><span>${r[0]}</span><small style="color:var(--mut)">${rd(r[1])} / ${r[2]} g</small></div>${bar1(pct(r[1],r[2]))}</div>`).join('')}</div>`}
function recent(){const seen=new Set(),L=[];[...S.food].reverse().forEach(x=>{if(!seen.has(x.n)&&L.length<6){seen.add(x.n);L.push(x)}});return L.length?`<div class="card"><h3>Recent foods (tap to add again)</h3><div class="row">${L.map(x=>`<button class="s sm" onclick="quickFood('${x.id}')">+ ${esc(x.n)}</button>`).join('')}</div></div>`:''}
function quickFood(id){const x=S.food.find(i=>i.id===id);if(!x)return;S.food.push(Object.assign({},x,{id:uid(),d:vd}));if(save()){toast('Added '+x.n);render()}}
let tI=null,tS=0;
function tmr(){const b=g('tb');if(tI){clearInterval(tI);tI=null;if(b)b.textContent='▶ Start timer';g('xm').value=Math.max(1,Math.round(tS/60));exCalc()}else{tS=0;tI=setInterval(()=>{const e=g('tt');if(e)e.textContent=Math.floor(tS/60)+':'+String(++tS%60).padStart(2,'0')},1000);b.textContent='■ Stop and use time'}}
function suggestCal(){const a=N('sa'),h=N('sh'),w=(lastW()||{}).w;if(!a||!h||!w)return bad('Fill age and height here, and add a weight in Body first');let t=(10*w+6.25*h-5*a+(V('sg')==='Female'?-161:5))*1.4;const f=V('sf');if(f==='Lose weight')t-=400;if(f==='Build muscle')t+=300;g('sc').value=Math.round(t/10)*10;toast('Suggested '+g('sc').value+' kcal. Press Save profile')}
function rg(p,l,v,c){const C=2*Math.PI*26;return`<div style="text-align:center"><svg viewBox="0 0 64 64" width="66" height="66"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--ln)" stroke-width="7"/><circle cx="32" cy="32" r="26" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}" transform="rotate(-90 32 32)"/></svg><div style="font-size:.72rem;color:var(--mut)">${l}</div><b style="font-size:.85rem">${v}</b></div>`}
function fastCard(){const f=S.fast;let el='';if(f){const m=Math.floor((Date.now()-f)/60000);el=Math.floor(m/60)+'h '+m%60+'m'}

 const R=[['Calories',T.k,G.k,'kcal',1],['Protein',T.p,G.p,'g',0],['Carbs',T.c,G.c,'g',1],['Fat',T.f,G.f,'g',1],['Water',D.w,+S.p.water,'ml',0],['Exercise',D.m,+S.p.ex,'min',0]];
 const ok=R.filter(r=>r[1]>=r[2]*.9&&!(r[4]&&r[1]>r[2]*1.15)).length;
 return`<h2>AI coach</h2><div class="card hero"><h3>Today's goals: ${ok} of 6 done</h3>${bar1(ok/6*100)}<p class="note">Targets: protein ≈ 1 g per kg body weight, carbs 50% and fat 30% of calories. Estimates only.</p></div>
 <div class="card"><h3>Goal check</h3>${R.map(r=>`<div class="item"><div>${r[0]}<small>${rd(r[1],1)} / ${r[2]} ${r[3]}</small></div>${st(r[1],r[2],r[4])}</div>`).join('')}</div>
 <div class="card"><h3>All food today</h3>${D.F.length?`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.8rem"><tr style="color:var(--mut);text-align:left"><th>Food</th><th>kcal</th><th>P</th><th>C</th><th>F</th></tr>${D.F.map(x=>`<tr style="border-top:1px solid var(--ln)"><td style="padding:6px 4px 6px 0">${esc(x.n)} ×${x.q}</td><td>${rd(x.k)}</td><td>${rd(x.p,1)}</td><td>${rd(x.c,1)}</td><td>${rd(x.f,1)}</td></tr>`).join('')}<tr style="border-top:2px solid var(--ac);font-weight:800"><td>Total</td><td>${T.k}</td><td>${T.p}</td><td>${T.c}</td><td>${T.f}</td></tr></table></div>`:'<p class="empty">Add food first (Food tab).</p>'}</div>
 <div class="card"><h3>Ask the AI coach</h3><button onclick="askAI()">Analyse my whole day</button> <button class="s" onclick="copySummary()">Copy today's summary</button><p class="note">Free smart coach: reviews all your food together, shows what to avoid, what is left, and what to do next. General wellness advice, not medical advice.</p><div id="aiout" style="margin-top:8px;line-height:1.6"></div></div>`}
/* Free smart coach: runs on your phone with simple rules, no internet, no API key, no cost */
function askAI(){const o=g('aiout'),D=dayData(),T=D.T,G=D.G,F=D.F;if(!F.length&&!D.m&&!D.w)return bad('Log some food, water or exercise first');
 const top=(f,n=2)=>[...F].sort((a,b)=>b[f]-a[f]).slice(0,n).filter(x=>x[f]>0).map(x=>x.n).join(' and ');
 const A=[],L=[],W=[],pl=G.p-T.p,kl=G.k-T.k,wl=S.p.water-D.w,ml=S.p.ex-D.m;
 if(T.k>G.k*1.1)A.push(`Calories are over by ${rd(T.k-G.k)} kcal. Eat less of ${top('k')}.`);
 if(T.f>G.f*1.15)A.push(`Fat is high (${T.f} g of ${G.f} g). Avoid fried or oily food. Biggest source: ${top('f')}.`);
 if(T.c>G.c*1.15)A.push(`Carbs are high (${T.c} g of ${G.c} g). Skip extra rice, roti, potato and sweets for the rest of today. Biggest source: ${top('c')}.`);
 if(F.filter(x=>x.cat==='Grains'||/potato|rice|roti|paratha|khichuri/i.test(x.n)).length>=3)A.push('You ate 3 or more starchy items (rice, roti, potato). Replace one with vegetables or dal.');
 if(F.some(x=>/sugar|sweet|cake|biscuit|cola|drink|juice|candy|chocolate|ice cream|mishti|rasgulla|halwa/i.test(x.n)))A.push('Sugary food found. Avoid more sugar today.');
 if(!A.length)A.push(F.length?'Nothing to avoid right now. Your food mix looks fine for your goals.':'No food logged yet.');
 [['Calories',T.k,G.k,'kcal'],['Protein',T.p,G.p,'g'],['Carbs',T.c,G.c,'g'],['Fat',T.f,G.f,'g'],['Water',D.w,+S.p.water,'ml'],['Exercise',D.m,+S.p.ex,'min']].forEach(r=>{const l=r[2]-r[1];
  L.push(l>r[2]*.1?`❌ ${r[0]}: ${rd(l)} ${r[3]} left (${rd(r[1],1)} of ${r[2]})`:l<-r[2]*.15&&r[0]!=='Water'&&r[0]!=='Exercise'&&r[0]!=='Protein'?`⚠️ ${r[0]}: over by ${rd(-l)} ${r[3]}`:`✅ ${r[0]}: done (${rd(r[1],1)} of ${r[2]})`)});
 if(pl>5)W.push(`Protein: ${rd(pl)} g left. Eat about ${Math.ceil(pl/6)} eggs, or ${rd(pl/12,1)} cups of dal, or ${rd(pl/18*100)} g fish or chicken.`);
 if(kl>150)W.push(`You can still eat about ${rd(kl)} kcal. Choose protein and vegetables first.`);
 if(wl>100)W.push(`Drink ${Math.ceil(wl/250)} more glasses of water (250 ml each).`);
 if(ml>0)W.push(`Do ${rd(ml)} more minutes of exercise. A brisk walk is enough.`);
 if(D.sl&&D.sl<420)W.push('You slept under 7 hours. Go to bed earlier tonight.');
 if(new Date().getHours()>=20&&W.length)W.push('It is late. Keep dinner light and finish the rest tomorrow.');
 if(!W.length)W.push('Great day. All goals are done. Rest well.');
 o.innerHTML=fmt('**Food review: what to avoid**\n- '+A.join('\n- ')+'\n\n**Goal result**\n'+L.join('\n')+'\n\n**What to do now**\n- '+W.join('\n- '))}

/* ============ SETTINGS, BACKUP, THEME ============ */
function toggleTheme(){S.p.theme=S.p.theme==='dark'?'light':'dark';applyTheme();save()}
function applyTheme(){document.documentElement.dataset.theme=S.p.theme;document.documentElement.dataset.acc=S.p.acc||'emerald';document.documentElement.style.setProperty('--lift',(S.p.lift===false?10:54)+'px');document.querySelector('meta[name=theme-color]').content=S.p.theme==='dark'?'#0a1020':'#f1f5f9'}
function saveSet(ev){ev.preventDefault();const c=N('sc'),w=N('sww'),x=N('sx'),a=g('sa').value,h=g('sh').value;
 if(!(c>=500&&c<=10000))return bad('Calorie goal: 500–10000');if(!(w>=500&&w<=10000))return bad('Water goal: 500–10000 ml');if(!(x>=1&&x<=600))return bad('Exercise goal: 1–600 min');
 if(a&&!(a>=5&&a<=120))return bad('Age must be 5–120');if(h&&!(h>=50&&h<=250))return bad('Height must be 50–250 cm');
 Object.assign(S.p,{name:V('sn'),gender:V('sg'),age:a,h,goal:V('sf'),cal:c,water:w,ex:x});if(save()){toast('Profile saved ✓');render()}}
async function exportData(){const data=JSON.stringify({app:'YOUR FITNESS',v:1,data:S},null,1),filename='your-fitness-backup-'+ymd()+'.json';
 try{const d=await CLD.use('downloads');if(d){await d.save({filename,data});toast('Backup saved');return}}catch(e){}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=filename;document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded. If you cannot find it, use Copy backup text')}catch(e){copyBackup()}}
async function copyBackup(){const data=JSON.stringify({app:'YOUR FITNESS',v:1,data:S});try{await navigator.clipboard.writeText(data);toast('Backup copied. Paste it into Notes or WhatsApp to keep it')}catch(e){g('bk').value=data;g('bk').select();toast('Select all and copy the text below',1)}}
function restoreText(){const t=V('bk');if(!t)return bad('Paste your backup text first');try{const j=JSON.parse(t),d=j.data||j;if(!d||!d.p||!['food','ex','wt','wa','sl'].every(k=>Array.isArray(d[k])))throw 0;if(!confirm('Replace ALL current data with this backup?'))return;S=Object.assign(structuredClone(DEF),d);save();applyTheme();toast('Backup restored ✓');render()}catch(e){bad('That text is not a valid backup')}}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result),d=j.data||j;
 if(!d||!d.p||!['food','ex','wt','wa','sl'].every(k=>Array.isArray(d[k])))throw 0;
 if(!confirm('Replace ALL current data with this backup?'))return;S=Object.assign(structuredClone(DEF),d);if(save()){applyTheme();toast('Backup restored ✓');render()}}catch(e){bad('That file is not a valid YOUR FITNESS backup')}};
 r.onerror=()=>bad('Could not read file');r.readAsText(f);inp.value=''}
function resetAll(){if(confirm('Delete ALL your data? This cannot be undone.')&&confirm('Really delete everything? Tip: export a backup first.')){S=structuredClone(DEF);save();applyTheme();toast('All data reset');go('home')}}
function pgSet(){const p=S.p;return`<h2>Profile & settings</h2><form class="card" onsubmit="saveSet(event)"><h3>Profile</h3>
 <div class="g2"><label>Name<input id="sn" value="${esc(p.name)}"></label><label>Gender (optional)<select id="sg">${['','Male','Female','Other'].map(x=>`<option ${x===p.gender?'selected':''}>${x}</option>`).join('')}</select></label>
 <label>Age<input id="sa" type="number" value="${p.age}"></label><label>Height (cm)<input id="sh" type="number" value="${p.h}"></label></div>
 <label>Fitness goal<select id="sf">${['Lose weight','Stay fit','Build muscle','Improve stamina'].map(x=>`<option ${x===p.goal?'selected':''}>${x}</option>`).join('')}</select></label>
 <div class="g2" style="grid-template-columns:repeat(3,1fr)"><label>Calories/day<input id="sc" type="number" value="${p.cal}"></label><label>Water ml/day<input id="sww" type="number" value="${p.water}"></label><label>Exercise min/day<input id="sx" type="number" value="${p.ex}"></label></div>
 <div class="row"><button type="submit">Save profile</button><button type="button" class="s" onclick="suggestCal()">Suggest calorie goal</button></div><p class="note">Suggestion is a rough estimate from age, height, latest weight and goal.</p></form>
 <div class="card"><h3>Theme</h3><div class="row"><button class="s" onclick="toggleTheme();render()">Switch to ${p.theme==='dark'?'light':'dark'} mode</button>${[['emerald','#10b981'],['ocean','#22d3ee'],['sunset','#fb923c']].map(a=>`<button class="sw ${(p.acc||'emerald')===a[0]?'on':''}" style="background:${a[1]}" aria-label="${a[0]} colour" onclick="S.p.acc='${a[0]}';save();applyTheme();render()"></button>`).join('')}</div></div>
 <div class="card"><h3>Menu position</h3><p class="note">A raised menu stays clear of the WebInto watermark at the bottom.</p><button class="s" onclick="S.p.lift=S.p.lift===false;save();applyTheme();render()">${p.lift===false?'Raise menu':'Lower menu'}</button></div>
 <div class="card"><h3>Backup & restore</h3><p class="note">Your data is saved online in your private space and opens on any device where you sign in. You can also download a backup file.</p><div class="row"><button onclick="exportData()">Export JSON</button><button class="s" onclick="g('imp').click()">Import JSON</button><input id="imp" type="file" accept=".json,application/json" hidden onchange="importData(this)"><button class="s" onclick="copyBackup()">Copy backup text</button></div><textarea id="bk" rows="3" placeholder="Paste backup text here, then press Restore" style="width:100%;margin-top:10px;padding:10px;border-radius:14px;border:1px solid var(--ln);background:var(--in);color:var(--tx);font:inherit"></textarea><button class="s" style="margin-top:8px" onclick="restoreText()">Restore from text</button></div>
 <div class="card"><h3>Storage</h3><p class="note">Everything is saved on this device. Use Export JSON to keep a backup.</p></div>
 <div class="card"><h3>Danger zone</h3><button class="d" onclick="resetAll()">Reset all data</button></div>`}
